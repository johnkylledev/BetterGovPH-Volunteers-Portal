<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Primary Meta Tags -->
  <title>BetterGovPH Volunteers - Civic Tech Community</title>
  <meta name="title" content="BetterGovPH Volunteers - Civic Tech Community" />
  <meta name="description" content="BetterGovPH Volunteers is a civic tech community of Filipino volunteers building open-source tools for better governance, transparency, and public accountability." />
  <meta name="keywords" content="BetterGovPH, volunteers, civic tech, Philippines, open source, governance, transparency, digital access card, civic community" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="theme-color" content="#1E3A8A" />
  <link rel="canonical" href="https://bettergov.ph/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bettergov.ph/" />
  <meta property="og:site_name" content="BetterGovPH Volunteers" />
  <meta property="og:title" content="BetterGovPH Volunteers - Civic Tech Community" />
  <meta property="og:description" content="Join our community of Filipino volunteers building open-source civic tools for better governance and public transparency." />
  <meta property="og:image" content="https://assets.bettergov.ph/logos/webp/icon-primary.webp" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://bettergov.ph/" />
  <meta name="twitter:title" content="BetterGovPH Volunteers - Civic Tech Community" />
  <meta name="twitter:description" content="Join our community of Filipino volunteers building open-source civic tools for better governance and public transparency." />
  <meta name="twitter:image" content="https://assets.bettergov.ph/logos/webp/icon-primary.webp" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Grotesk:wght@300..700&family=Quicksand:wght@300;400;500;600;700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">

  <!-- Google Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BetterGovPH Volunteers",
      "url": "https://bettergov.ph/",
      "logo": "https://assets.bettergov.ph/logos/webp/icon-primary.webp",
      "description": "A civic tech community of Filipino volunteers building open-source tools for better governance.",
      "sameAs": [
        "https://github.com/BetterGovPH",
        "https://discord.gg/mHtThpN8bT"
      ]
    }
  </script>

  <script type="module">
    if (import.meta.hot?.on) {
      import.meta.hot.on('vite:error', (error) => {
        if (error.err) {
          console.error(
            [error.err.message, error.err.frame].filter(Boolean).join('\n'),
          )
        }
      })
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
